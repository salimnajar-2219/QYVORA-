<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QYVORA AI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #080b16;
    color: white;
    min-height: 100vh;
}

header {
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #252b40;
}

.logo {
    color: #927cff;
    font-size: 25px;
    font-weight: bold;
}

.home {
    color: white;
    text-decoration: none;
    border: 1px solid #45405f;
    padding: 9px 15px;
    border-radius: 8px;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 30px 18px;
}

.welcome {
    text-align: center;
    margin: 65px 0 35px;
}

.welcome h1 {
    font-size: 38px;
    margin-bottom: 15px;
}

.welcome h1 span {
    color: #927cff;
}

.welcome p {
    color: #aab0c5;
    line-height: 1.6;
}

.chat-box {
    height: 400px;
    overflow-y: auto;
    padding: 20px;
    background: #111629;
    border: 1px solid #292f49;
    border-radius: 15px;
}

.message {
    margin-bottom: 20px;
    line-height: 1.6;
    padding: 13px 16px;
    border-radius: 12px;
    max-width: 90%;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #6251cf;
    margin-left: auto;
}

.bot {
    background: #202840;
    margin-right: auto;
}

.input-area {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid #343b57;
    background: #111629;
    color: white;
    outline: none;
    font-size: 15px;
}

button {
    border: none;
    background: #7965f5;
    color: white;
    padding: 0 22px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

.suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
    justify-content: center;
}

.suggestions button {
    padding: 10px 13px;
    background: #171e34;
    border: 1px solid #343b57;
    font-size: 13px;
}

.note {
    color: #7f879e;
    text-align: center;
    font-size: 12px;
    margin-top: 18px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #8189a0;
}

@media(max-width:500px) {
    .welcome h1 {
        font-size: 30px;
    }

    .chat-box {
        height: 390px;
    }

    button {
        padding: 0 15px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">QYVORA AI</div>
    <a href="index.html" class="home">← Home</a>
</header>

<main class="container">

    <section class="welcome">
        <h1>Meet <span>QYVORA AI</span></h1>
        <p>Your digital assistant for ideas, learning and creativity.</p>
    </section>

    <div class="chat-box" id="chatBox" aria-live="polite">
        <div class="message bot">
            Hello! 👋 Welcome to QYVORA AI.

            I'm your digital assistant. What would you like to explore today?
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="userInput"
            placeholder="Ask QYVORA anything..."
            autocomplete="off"
        >
        <button id="sendButton" onclick="sendMessage()">Send ➤</button>
    </div>

    <div class="suggestions">
        <button onclick="suggest('Tell me about artificial intelligence')">🤖 AI</button>
        <button onclick="suggest('Help me learn something new')">📚 Learn</button>
        <button onclick="suggest('Give me a creative idea')">💡 Ideas</button>
    </div>

    <p class="note">
        QYVORA AI Preview • AI model connection coming soon.
    </p>

</main>

<footer>
    © 2026 QYVORA. All rights reserved.
</footer>

<script>
const chatBox = document.getElementById("chatBox");
const input = document.getElementById("userInput");
const sendButton = document.getElementById("sendButton");

function addMessage(text, type) {
    const message = document.createElement("div");
    message.className = "message " + type;
    message.textContent = text;
    chatBox.appendChild(message);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function suggest(text) {
    input.value = text;
    sendMessage();
}

function getReply(text) {
    const msg = text.toLowerCase();

    if (msg.includes("hello") || msg.includes("hi")) {
        return "Hello! Welcome to QYVORA. How can I help you today?";
    }

    if (msg.includes("your name") || msg.includes("who are you")) {
        return "I am QYVORA AI, your digital assistant.";
    }

    if (msg.includes("artificial intelligence") || msg.includes("what is ai")) {
        return "Artificial Intelligence (AI) is technology that allows computers to perform tasks that normally require human intelligence.";
    }

    if (msg.includes("website")) {
        return "Websites are made using technologies like HTML, CSS and JavaScript. QYVORA also aims to help people create websites.";
    }

    if (msg.includes("learn") || msg.includes("study")) {
        return "Learning is a journey! Choose a topic, understand its basics and practise regularly.";
    }

    if (msg.includes("idea")) {
        return "Here is an idea: create a digital tool that solves a real problem in your community.";
    }

    if (msg.includes("thank")) {
        return "You're welcome! Thanks for using QYVORA AI.";
    }

    return "Thanks for your message! I am currently running in preview mode. My full AI brain will be connected in a future update.";
}

function sendMessage() {
    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");
    input.value = "";
    sendButton.disabled = true;

    setTimeout(() => {
        addMessage(getReply(text), "bot");
        sendButton.disabled = false;
        input.focus();
    }, 500);
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
