<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QYVORA Pro AI Assistant</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #161b22;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #30363d;
            color: #58a6ff;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #238636;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: #21262d;
            color: #c9d1d9;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #30363d;
        }
        #input-container {
            padding: 15px;
            background-color: #161b22;
            border-top: 1px solid #30363d;
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex: 1;
            padding: 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }
        #send-btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        #send-btn:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>

    <header>⚡ QYVORA Pro AI Assistant</header>

    <div id="chat-container">
        <div class="message ai-message">Hello! I am QYVORA Pro AI. You can ask me any advanced questions regarding coding, security, or complex topics!</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Ask anything advanced..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        // Yahan apni OpenAI API key daal sakte hain (jaise: "sk-proj-...")
        const apiKey = "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";

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const prompt = inputField.value.trim();

            if (!prompt) return;

            // Display user message
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-message';
            userMsgDiv.textContent = prompt;
            chatContainer.appendChild(userMsgDiv);

            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Loading message
            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai-message';
            aiMsgDiv.textContent = "Thinking deeply...";
            chatContainer.appendChild(aiMsgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + apiKey
                    },
                    body: JSON.stringify({
                        model: "gpt-4o",
                        messages: [
                            { role: "system", content: "You are QYVORA Pro, an elite, highly advanced AI assistant and security expert. Provide deep, accurate, structured, and professional answers." },
                            { role: "user", content: prompt }
                        ]
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices.length > 0) {
                    aiMsgDiv.textContent = data.choices[0].message.content;
                } else if (data.error) {
                    aiMsgDiv.textContent = "API Error: " + data.error.message;
                } else {
                    aiMsgDiv.textContent = "An error occurred. Please check your API key.";
                }
            } catch (error) {
                aiMsgDiv.textContent = "Connection error: Unable to reach the AI server.";
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Send message on pressing Enter key
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>

</body>
</html>
